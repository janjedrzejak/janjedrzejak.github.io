<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Płyty, do których wracam. Osobista kolekcja płyt CD Jana Jędrzejaka, od rocka po black metal.">
  <meta property="og:title" content="Półka z płytami CD | Jan Jędrzejak">
  <meta property="og:description" content="Płyty, do których wracam. Osobista kolekcja płyt CD Jana Jędrzejaka.">
  <meta property="og:url" content="https://janjedrzejak.github.io/vinyls/">
  <link rel="canonical" href="https://janjedrzejak.github.io/vinyls/">
  <link rel="icon" href="/books/mark.svg" type="image/svg+xml">
  <title>Półka z płytami CD | Jan Jędrzejak</title>
  <link rel="stylesheet" href="/vinyls/vinyls.css">
  <script type="module" src="/vinyls/vinyls.js"></script>
</head>
<body class="vinyl-page">
  <main id="root" class="vinyl-main" tabindex="-1">
    <header class="vinyl-intro">
      <h1>Półka z płytami CD</h1>
      <p>Płyty, do których wracam.</p>
    </header>
    <section class="vinyl-player" aria-label="Przeglądaj płyty CD" hidden>
      <div class="vinyl-crate" role="group" aria-label="Pudełka płyt CD">
        <div class="vinyl-models" id="vinyl-models"></div>
      </div>
      <div class="vinyl-selection">
        <div class="vinyl-metadata" aria-live="polite" aria-atomic="true">
          <p class="vinyl-artist"></p>
          <h2 class="vinyl-title"></h2>
          <p class="vinyl-year"></p>
        </div>
        <div class="vinyl-actions">
          <button type="button" class="vinyl-open" aria-haspopup="dialog">Szczegóły albumu</button>
        </div>
        <div class="vinyl-navigation" aria-label="Zmień album">
          <button type="button" class="vinyl-previous" aria-label="Poprzedni album">←</button>
          <span class="vinyl-count"></span>
          <button type="button" class="vinyl-next" aria-label="Następny album">→</button>
        </div>
      </div>
    </section>
    <details class="vinyl-catalog" open>
      <summary>Lista płyt <span class="vinyl-total"></span></summary>
      <ol class="vinyl-list"></ol>
    </details>
  </main>
  <dialog class="vinyl-detail" aria-labelledby="album-title">
    <button type="button" class="vinyl-close" autofocus aria-label="Zamknij szczegóły">×</button>
    <div class="album-summary">
      <img class="album-cover" alt="" width="600" height="600">
      <div>
        <p class="album-artist"></p>
        <h2 id="album-title"></h2>
        <p class="album-year"></p>
        <a class="vinyl-listen" target="_blank" rel="noreferrer"></a>
      </div>
    </div>
    <h3 class="album-track-heading">Utwory</h3>
    <ol class="album-tracks"></ol>
  </dialog>
</body>
</html>
