function sceneRender(){

const PALS=[' .`', ' .,:-~=+*x#%@',' .,:;ioO0Q#@'];
function raster(){
 const data=oc.getImageData(0,0,sceneW,sceneH).data;
 const nx=box.w-2, ny=box.h-2, sx=sceneW/nx,sy=sceneH/ny;

 const buckets=new Map();
 const sample=(x,y)=>{
   const ix=clamp(Math.floor(x),0,sceneW-1), iy=clamp(Math.floor(y),0,sceneH-1),i=(iy*sceneW+ix)*4;
   return [data[i],data[i+1],data[i+2]];
 };
 const lum=p=>p[0]*.22+p[1]*.65+p[2]*.13;
 for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){
   const xx=(x+.5)*sx, yy=(y+.5)*sy;
   const a=sample(xx,yy),left=sample(xx-sx*.6,yy),right=sample(xx+sx*.6,yy),up=sample(xx,yy-sy*.6),down=sample(xx,yy+sy*.6);
   const c=lum(a),L=lum(left),R=lum(right),U=lum(up),B=lum(down);
   const max=Math.max(c,L,R,U,B),min=Math.min(c,L,R,U,B);
   // Suppress the landscape's low-intensity texture. The foreground must be readable.
   if(max<47)continue;
   let ch='',gX=R-L,gY=B-U;
   const edge=Math.hypot(gX,gY),tone=c;
   if(edge>32 && max>76){
     const aa=Math.atan2(gY,gX);
     if(Math.abs(gX)>Math.abs(gY)*1.95)ch='|';
     else if(Math.abs(gY)>Math.abs(gX)*1.95)ch='-';
     else ch=gX*gY>0?'\\':'/';
   }else if(c>49){
     const ramp=' .,:;-=+*#%@';
     const level=clamp(Math.floor((c-35)/175*(ramp.length-1)),1,ramp.length-1);
     ch=ramp[level];
   }else if(max>82&&edge>12){ch='.'}else continue;
   if(ch===' '||!ch)continue;
   const r=Math.min(255,Math.floor(a[0]*1.32+22)),g=Math.min(255,Math.floor(a[1]*1.27+22)),b=Math.min(255,Math.floor(a[2]*1.28+22));
   const key=`${r>>4},${g>>4},${b>>4}`;if(!buckets.has(key))buckets.set(key,[]);
   buckets.get(key).push([x,y,ch]);
 }
 for(const [key,items] of buckets){const [r,g,b]=key.split(',').map(Number);ctx.fillStyle=`rgb(${Math.min(255,r*16+12)},${Math.min(255,g*16+12)},${Math.min(255,b*16+12)})`;

}
function glyph(x,y,t,color=C.hud){ctx.fillStyle=color;ctx.fillText(t,x*cw,y*ch)}
function frameRect(x,y,w,h,title=''){if(w<5||h<4)return;
 glyph(x,y,'+'+'-'.repeat(w-2)+'+',C.edge);for(let j=y+1;j<y+h-1;j++){glyph(x,j,'|',C.edge);glyph(x+w-1,j,'|',C.edge)}glyph(x,y+h-1,'+'+'-'.repeat(w-2)+'+',C.edge);
 if(title)glyph(x+2,y,('['+title+']').slice(0,w-5),C.gold)
}
function hud(){
 ctx.font=`${font}px Menlo,Consolas,'Courier New',monospace`;ctx.textBaseline='top';
 frameRect(0,0,cols,rows,'BIALY WILK / ASCII 05');
 glyph(3,2,'B I A L Y   W I L K',C.pale);
 glyph(3,3,'D A R K   F A N T A S Y   /   A S C I I',C.gold);
 const status=paused?'[ PAUZA ]':'[ LIVE ]';if(cols>95)glyph(cols-status.length-3,2,status,C.mint);
 frameRect(box.x-1,box.y-1,box.w+2,box.h+2,'POPIOL I SWIATLO / IZOMETRIA');
 if(box.h>19){glyph(box.x+3,box.y+2,'WIEDZMIN  >  UPIOR',C.gold);}
 if(!mobile){frameRect(cols-31,box.y-1,29,box.h+2,'DZIENNIK');glyph(cols-29,box.y+3,'[ ZLECENIE ]',C.gold);glyph(cols-29,box.y+6,'RUINY NA PRZELECZY',C.pale);glyph(cols-29,box.y+9,'W MROKU KRYJE SIE',C.muted);glyph(cols-29,box.y+10,'STARY UPIOR...',C.muted);glyph(cols-29,box.y+17,'[ KONTROLA ]',C.gold);glyph(cols-29,box.y+20,'1 / MIECZ',C.pale);glyph(cols-29,box.y+22,'2 / IGNI',C.fire);glyph(cols-29,box.y+24,'3 / TLO',C.pale);glyph(cols-29,box.y+26,'4 / PAUZA',C.pale);}
 const base=box.y+box.h+2;
 frameRect(1,base,cols-2,rows-base-1,'AKCJE / DOTKNIJ');
 for(const b of buttons){const active=(b.code==='attack'&&time-attackAt<.75)||(b.code==='igni'&&time-magicAt<1.2)||(b.code==='pause'&&paused);
 const label=b.code==='attack'?'1 MIECZ':b.code==='igni'?'2 IGNI':b.code==='ambience'?'3 TLO '+(ambience?'ON':'OFF'):(paused?'4 WZNOW':'4 PAUZA');
 const shown=('[ '+label+' ]').padEnd(b.w-1,' ').slice(0,b.w-1);
 glyph(b.x,b.y,shown,active?C.fire:b.code==='igni'?C.gold:C.pale);
 glyph(b.x,b.y+1,(active?'^':'.').repeat(Math.max(1,b.w-2)),active?C.gold:C.edge)
 }
 const hintY=buttons.reduce((acc,b)=>Math.max(acc,b.y+2),base)+1;
 if(hintY<rows-2)glyph(3,hintY,'DOTKNIJ SCENY: MIECZ  /  '+(mobile?'MOBILE':'DESKTOP'),C.muted)
}
function layout(){W=window.innerWidth;H=window.innerHeight;D=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);
 font=W<500?10:W<850?10.8:12;cw=font*.61;ch=font*1.21;cols=Math.max(35,Math.floor(W/cw));rows=Math.max(32,Math.floor(H/ch));mobile=cols<100;
 const tail=mobile?(rows<48?14:16):13;
 box={x:2,y:7,w:mobile?cols-4:cols-37,h:Math.max(17,rows-tail)};
 const controlsY=box.y+box.h+3;buttons=[];
 const two=cols<78;const bw=two?Math.floor((cols-8)/2):Math.floor((cols-8)/4);
 for(let i=0;i<4;i++){buttons.push({x:two?2+(i%2)*(bw+2):2+i*(bw+1),y:controlsY+(two?Math.floor(i/2)*3:0),w:bw,h:2,code:['attack','igni','ambience','pause'][i]})}
}
function render(now){requestAnimationFrame(render);if(!last)last=now;const dt=Math.min(.09,(now-last)/1000);last=now;const minDelay=1000/(mobile?14:23);if(now-lastDraw<minDelay)return;fps=Math.round(1000/Math.max(1,now-lastDraw));lastDraw=now;if(!paused)time+=dt;
 ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);sceneRender();raster();hud();frame++;
}
function action(code){if(code==='attack')attackAt=time;if(code==='igni')magicAt=time;if(code==='ambience')ambience=!ambience;if(code==='pause')paused=!paused;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)/cw,y=(e.clientY-b.top)/ch;for(const q of buttons){if(x>=q.x-1&&x<=q.x+q.w&&y>=q.y-1&&y<=q.y+3){action(q.code);return}}if(x>box.x&&x<box.x+box.w&&y>box.y&&y<box.y+box.h)action('attack');});
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(key==='1'||e.code==='Space'){e.preventDefault();action('attack')}else if(key==='2'||key==='i')action('igni');else if(key==='3'||key==='t')action('ambience');else if(key==='4'||key==='p')action('pause')});
window.addEventListener('resize',layout,{passive:true});document.addEventListener('visibilitychange',()=>{last=0;lastDraw=0});layout();requestAnimationFrame(render);
})();
</script></body></html>
